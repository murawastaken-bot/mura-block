  <script>
    const apiUrl = "https://aboutmurasaki.vercel.app/api/1530102862053642270";
    const avatar = document.getElementById("avatar");
    const profileLinks = [
      document.getElementById("profile-link"),
      document.getElementById("name-link")
    ];
    const hoverAvatar = avatar.dataset.hover;
    let defaultAvatar = avatar.src;

    avatar.addEventListener("mouseenter", () => {
      avatar.src = hoverAvatar;
    });
    avatar.addEventListener("mouseleave", () => {
      avatar.src = defaultAvatar;
    });

    fetch(apiUrl)
      .then(response => {
        if (!response.ok) throw new Error("Profile API unavailable");
        return response.json();
      })
      .then(profile => {
        if (profile.profileUrl) {
          profileLinks.forEach(link => link.href = profile.profileUrl);
        }
        if (profile.display_name) {
          document.getElementById("name-link").textContent = profile.display_name;
        }
        if (profile.avatarUrl) {
          defaultAvatar = profile.avatarUrl;
          if (!avatar.matches(":hover")) avatar.src = defaultAvatar;
        }
        if (profile.display_name) {
          avatar.alt = profile.display_name + "'s Discord avatar";
        }
      })
      .catch(() => {
